[libdefaults]
    default_realm = LAB.KERB
    dns_lookup_kdc = true
    dns_lookup_realm = false
    rdns = false
    forwardable = true
    ticket_lifetime = 24h

[realms]
    LAB.KERB = {
        kdc = dc01.lab.kerb
        admin_server = dc01.lab.kerb
    }

[domain_realm]
    .lab.kerb = LAB.KERB
    lab.kerb = LAB.KERB

